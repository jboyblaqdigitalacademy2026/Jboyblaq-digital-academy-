<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00307A">
<title>Admin | JboyBlaq Digital Academy</title>
<style>
:root{--blue:#0056D2;--dark:#00307A;--soft:#EAF1FD;--ink:#1B2A41;--muted:#5B6B82;--line:#DCE4F0;--green:#1FA855;--red:#C62828;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#F6F8FC;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:900px;margin:0 auto;padding:0 16px;font-weight:800}
.nav button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;font-family:inherit}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center}
.b1{background:var(--blue);color:#fff}.b2{background:var(--soft);color:var(--blue)}.b3{background:var(--green);color:#fff}.b4{background:#FDECEC;color:var(--red)}
.full{width:100%}.sm{padding:9px 12px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:17px}.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
h2{margin:6px 0 14px;font-size:21px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 5px}
input,textarea,select{width:100%;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-family:inherit;background:#fff}
textarea{min-height:90px}
.tabs{display:flex;gap:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:10px 8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);font-family:inherit;white-space:nowrap}
.tabs button.on{background:var(--blue);color:#fff}
.msg{padding:11px 13px;border-radius:10px;font-size:14px;margin-bottom:13px;background:var(--soft);color:var(--dark)}.msg.err{background:#FDECEC;color:var(--red)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:#E3F6EA;color:#14793C;margin:0 6px 6px 0}
.badge.w{background:#FFF3D6;color:#8A5A00}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 8px}.bar i{display:block;height:100%;width:0;background:var(--green)}
.hide{display:none}.muted{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header><div class="nav"><span>Admin Dashboard</span><button id="outBtn" class="hide">Log out</button></div></header>

<div class="wrap" id="authView" style="max-width:440px">
  <div class="card" style="margin-top:20px"><h2>Admin login</h2><div id="amsg"></div>
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn b1 full" id="goBtn">Log in</button></div>
</div>

<div class="wrap hide" id="appView">
  <div class="tabs" id="tabs"><button data-t="pay" class="on">Payments</button><button data-t="stu">Students</button><button data-t="crs">Courses</button><button data-t="les">Lessons</button></div>
  <div id="msg"></div><div id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<script>
var sb=supabase.createClient("https://cogebzxdqlhojzabqeli.supabase.co","sb_publishable_QwatGWcSpnVydE7j8Uj3gQ_G5GxFsI9");
var A={courses:[],enr:[],prof:[],les:[]},tab="pay",lc=null,VS={},UP={};
var SN={0:"Waiting for upload",1:"Uploaded",2:"Processing",3:"Encoding",4:"Ready",5:"Error - upload again",6:"Upload failed - upload again"};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function naira(n){return "\u20A6"+Number(n).toLocaleString("en-NG")}
function say(t,err){$("msg").innerHTML=t?'<div class="msg'+(err?' err':'')+'">'+esc(t)+'</div>':"";if(t)scrollTo(0,0)}
function ok(u){return !u||/^https:\/\//.test(u)}
function cname(id){var c=A.courses.filter(function(x){return x.id===id})[0];return c?c.title:"(deleted)"}
function pr(id){return A.prof.filter(function(p){return p.id===id})[0]||{full_name:"(no name)",email:""}}
function dt(s){return s?new Date(s).toLocaleDateString("en-GB"):""}
function lesson(id){return A.les.filter(function(l){return l.id===id})[0]}
async function adm(b){
  var r;
  if(b.action==="create")r=await sb.rpc("admin_bunny_create",{p_title:b.title});
  else if(b.action==="status")r=await sb.rpc("admin_bunny_status",{p_video:b.videoId});
  else if(b.action==="delete")r=await sb.rpc("admin_bunny_delete",{p_video:b.videoId});
  else throw new Error("Unknown action");
  if(r.error)throw new Error(r.error.message);
  return r.data;
}

$("goBtn").onclick=async function(){
  var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error)$("amsg").innerHTML='<div class="msg err">'+esc(r.error.message)+'</div>';
};
$("outBtn").onclick=function(){sb.auth.signOut()};

async function load(){
  var r=await Promise.all([sb.from("courses").select("*").order("created_at"),sb.from("enrollments").select("*").order("requested_at",{ascending:false}),sb.from("profiles").select("*").order("created_at",{ascending:false}),sb.from("lessons").select("*").order("position")]);
  A.courses=r[0].data||[];A.enr=r[1].data||[];A.prof=r[2].data||[];A.les=r[3].data||[];
  if(!lc&&A.courses[0])lc=A.courses[0].id;
}
function show(){
  var T=$("tabs").children;for(var i=0;i<T.length;i++)T[i].className=T[i].dataset.t===tab?"on":"";
  $("content").innerHTML=tab==="pay"?vPay():tab==="stu"?vStu():tab==="crs"?vCrs():vLes();
  if(tab==="les")A.les.filter(function(l){return l.course_id===lc&&l.video_id&&!UP[l.id]}).forEach(chk);
}
function vPay(){
  var P=A.enr.filter(function(e){return e.status==="pending"});
  var h="<h2>Pending payments ("+P.length+")</h2>";
  if(!P.length)h+='<div class="card"><p>No pending requests. Students appear here after they tap Buy.</p></div>';
  return h+P.map(function(e){var p=pr(e.user_id),c=A.courses.filter(function(x){return x.id===e.course_id})[0]||{};
    return '<div class="card"><h3>'+esc(p.full_name)+'</h3><p>'+esc(p.email)+'<br>'+esc(c.title)+' &middot; <b>'+naira(c.price||0)+'</b><br>Requested '+dt(e.requested_at)+'</p><p>Approve only after you confirm the money in your bank app.</p><div class="row"><button class="btn b3" data-a="ap" data-v="'+e.id+'">Approve</button><button class="btn b4" data-a="rj" data-v="'+e.id+'">Reject</button></div></div>'}).join("");
}
function vStu(){
  var h="<h2>Students ("+A.prof.length+")</h2>";
  return h+A.prof.map(function(p){
    var E=A.enr.filter(function(e){return e.user_id===p.id});
    return '<div class="card"><h3>'+esc(p.full_name||"(no name)")+'</h3><p>'+esc(p.email)+' &middot; joined '+dt(p.created_at)+'</p>'+
    (E.length?E.map(function(e){return '<span class="badge'+(e.status==="approved"?"":" w")+'">'+esc(cname(e.course_id))+' ('+e.status+')</span>'+(e.status==="approved"?'<button class="btn b4 sm" data-a="rv" data-v="'+e.id+'">Revoke</button> ':'')}).join(""):'<span class="muted">No courses yet</span>')+'</div>'}).join("");
}
function vCrs(){
  return '<h2>Courses</h2><div class="card"><h3>Add a course</h3><label for="nt">Title</label><input id="nt"><label for="nd">Description</label><textarea id="nd"></textarea><label for="np">Price (naira, numbers only)</label><input id="np" inputmode="numeric"><button class="btn b1 full" data-a="addC">Add course</button></div>'+
  A.courses.map(function(c){return '<div class="card"><label>Title</label><input id="t'+c.id+'" value="'+esc(c.title)+'"><label>Description</label><textarea id="d'+c.id+'">'+esc(c.description)+'</textarea><label>Price</label><input id="p'+c.id+'" inputmode="numeric" value="'+c.price+'"><div class="row"><button class="btn b1" data-a="svC" data-v="'+c.id+'">Save</button><button class="btn b2" data-a="pub" data-v="'+c.id+'">'+(c.published?"Hide":"Show")+'</button></div><p class="muted" style="margin-top:8px">'+(c.published?"Visible to students":"Hidden from students")+'</p></div>'}).join("");
}
function vLes(){
  var L=A.les.filter(function(l){return l.course_id===lc});
  return '<h2>Lessons</h2><label for="lcs">Course</label><select id="lcs">'+A.courses.map(function(c){return '<option value="'+c.id+'"'+(c.id===lc?" selected":"")+'>'+esc(c.title)+'</option>'}).join("")+'</select>'+
  '<div class="card"><h3>Add a lesson</h3><p>Add the lesson first, then upload its video from the lesson card below.</p><label for="lt">Lesson title</label><input id="lt"><label for="lv">Video link (optional, only if you are not uploading a video)</label><input id="lv" inputmode="url"><label for="ln">Notes / script</label><textarea id="ln"></textarea><label for="lm">Material link, e.g. PDF (optional, https://...)</label><input id="lm" inputmode="url"><label for="lp">Lesson number</label><input id="lp" inputmode="numeric" value="'+(L.length+1)+'"><button class="btn b1 full" data-a="addL">Add lesson</button></div>'+
  '<h3 style="margin:16px 0 8px">Lessons in this course ('+L.length+')</h3>'+L.map(function(l){var id=l.id;
    return '<div class="card"><h3>'+l.position+'. '+esc(l.title)+'</h3><p>'+(l.video_id?'Video: <b id="vs'+id+'">Checking...</b>':esc(l.video_url||"No video yet"))+'</p>'+
    '<div class="bar hide" id="pw'+id+'"><i id="pb'+id+'"></i></div><p class="muted" id="pm'+id+'"></p>'+
    '<input type="file" accept="video/*" class="hide" id="f'+id+'" data-lid="'+id+'">'+
    '<div class="row"><button class="btn b1 sm" data-a="pick" data-v="'+id+'">'+(l.video_id?"Replace video":"Upload video")+'</button>'+(l.video_id?'<button class="btn b4 sm" data-a="delV" data-v="'+id+'">Delete video</button>':'')+'</div>'+
    '<div style="height:10px"></div><button class="btn b4 sm" data-a="delL" data-v="'+id+'">Delete lesson</button></div>'}).join("");
}
async function run(q,okMsg){var r=await q;if(r.error){say("Error: "+r.error.message,1);return false}await load();show();say(okMsg);return true}

/* ---- Bunny: status ---- */
async function chk(l){
  var e=$("vs"+l.id);
  try{var r=await adm({action:"status",videoId:l.video_id});VS[l.video_id]=r.status;
    if(e)e.textContent=(SN[r.status]||"Status "+r.status)+((r.status>=1&&r.status<4&&r.progress!=null)?" ("+r.progress+"%)":"")}
  catch(x){if(e)e.textContent="Could not check status"}
}
setInterval(function(){if(tab!=="les")return;A.les.filter(function(l){return l.course_id===lc&&l.video_id&&VS[l.video_id]!==4&&!UP[l.id]}).forEach(chk)},8000);

/* ---- Bunny: upload ---- */
function setP(id,pct,msg){var w=$("pw"+id),b=$("pb"+id),m=$("pm"+id);if(w)w.className="bar";if(b)b.style.width=pct+"%";if(m)m.textContent=msg||""}
async function startUpload(lid,file){
  var l=lesson(lid);if(!l||!file)return;
  if(UP[lid])return say("An upload is already running for this lesson.",1);
  UP[lid]=1;var oldId=l.video_id,c=null;
  try{
    setP(lid,0,"Preparing upload...");
    c=await adm({action:"create",title:l.title});
    await new Promise(function(res,rej){
      var u=new tus.Upload(file,{endpoint:"https://video.bunnycdn.com/tusupload",retryDelays:[0,3000,5000,10000,20000],
        headers:{AuthorizationSignature:c.signature,AuthorizationExpire:String(c.expire),VideoId:c.videoId,LibraryId:String(c.libraryId)},
        metadata:{filetype:file.type||"video/mp4",title:l.title},
        onError:rej,
        onProgress:function(a,t){var p=Math.round(a/t*100);setP(lid,p,"Uploading "+p+"%. Keep this page open and your screen on.")},
        onSuccess:res});
      u.start();
    });
    var r=await sb.from("lessons").update({video_id:c.videoId}).eq("id",lid);
    if(r.error)throw new Error(r.error.message);
    if(oldId){try{await adm({action:"delete",videoId:oldId})}catch(e){}}
    await load();say("Upload finished. Bunny is now processing the video. This can take a few minutes.");
  }catch(e){
    if(c&&c.videoId){try{await adm({action:"delete",videoId:c.videoId})}catch(x){}}
    say("Upload failed: "+(e&&e.message?e.message:e),1);
  }
  delete UP[lid];show();
}

document.addEventListener("change",function(e){
  if(e.target.id==="lcs"){lc=e.target.value;show()}
  else if(e.target.dataset&&e.target.dataset.lid){var f=e.target.files[0];e.target.value="";startUpload(e.target.dataset.lid,f)}
});
document.addEventListener("click",async function(e){
  var t=e.target.closest("[data-a],#tabs button");if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;say("");return show()}
  var a=t.dataset.a,v=t.dataset.v;
  if(a==="ap")await run(sb.from("enrollments").update({status:"approved",approved_at:new Date().toISOString()}).eq("id",v),"Approved. The student can now open the course.");
  else if(a==="rj"){if(confirm("Reject this request?"))await run(sb.from("enrollments").update({status:"rejected"}).eq("id",v),"Request rejected.")}
  else if(a==="rv"){if(confirm("Remove this student's access to the course?"))await run(sb.from("enrollments").update({status:"rejected"}).eq("id",v),"Access removed.")}
  else if(a==="addC"){var n=$("nt").value.trim(),p=parseInt($("np").value,10);
    if(!n||isNaN(p)||p<0)return say("Enter a title and a price in numbers.",1);
    await run(sb.from("courses").insert({title:n,description:$("nd").value.trim(),price:p,published:true}),"Course added.")}
  else if(a==="svC"){var pp=parseInt($("p"+v).value,10),tt=$("t"+v).value.trim();
    if(!tt||isNaN(pp)||pp<0)return say("Enter a title and a price in numbers.",1);
    await run(sb.from("courses").update({title:tt,description:$("d"+v).value.trim(),price:pp}).eq("id",v),"Course saved.")}
  else if(a==="pub"){var c=A.courses.filter(function(x){return x.id===v})[0];await run(sb.from("courses").update({published:!c.published}).eq("id",v),c.published?"Course hidden.":"Course visible.")}
  else if(a==="addL"){var lt=$("lt").value.trim(),lv=$("lv").value.trim(),lm=$("lm").value.trim(),lp=parseInt($("lp").value,10)||1;
    if(!lt)return say("Enter the lesson title.",1);
    if(!ok(lv)||!ok(lm))return say("Links must start with https://",1);
    await run(sb.from("lessons").insert({course_id:lc,title:lt,video_url:lv||null,notes:$("ln").value.trim()||null,material_url:lm||null,position:lp}),"Lesson added. Now tap Upload video on its card.")}
  else if(a==="pick"){if(UP[v])return;var f=$("f"+v);if(f)f.click()}
  else if(a==="delV"){var L1=lesson(v);
    if(L1&&L1.video_id&&confirm("Delete this lesson's video? Students will see no video until you upload a new one.")){
      try{await adm({action:"delete",videoId:L1.video_id})}catch(x){return say("Could not delete the video: "+x.message,1)}
      await run(sb.from("lessons").update({video_id:null}).eq("id",v),"Video deleted.")}}
  else if(a==="delL"){var L2=lesson(v);
    if(confirm("Delete this lesson? Its video and student progress on it are also removed.")){
      if(L2&&L2.video_id){try{await adm({action:"delete",videoId:L2.video_id})}catch(x){}}
      await run(sb.from("lessons").delete().eq("id",v),"Lesson deleted.")}}
});

async function enter(session){
  if(!session){$("appView").className="wrap hide";$("authView").className="wrap";$("outBtn").className="hide";$("pw").value="";return}
  $("authView").className="wrap hide";$("outBtn").className="";
  var r=await sb.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
  if(!r.data){$("appView").className="wrap";$("tabs").className="hide";$("content").innerHTML='<div class="card"><h3>Not an admin</h3><p>This account does not have admin access.</p></div>';return}
  $("tabs").className="tabs";$("appView").className="wrap";await load();show();
}
sb.auth.onAuthStateChange(function(ev,s){if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="INITIAL_SESSION")setTimeout(function(){enter(s)},0)});
</script>
</body>
</html>
